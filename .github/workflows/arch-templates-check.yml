name: Arch templates + effective-page checks

# Guards the architecture-wiki -> history-api migration's remaining
# cross-language contract: src/architecture/arch-templates.generated.json
# must not be stale vs the .ts sources it's exported from, and
# scripts/arch_effective_page.py's template-merge logic (still used by the
# pipeline for a brand-new page with no history-api entry yet) must keep
# behaving correctly per its unit tests.

on:
  push:
    branches: [main]
    paths:
      - 'src/architecture/**'
      - 'scripts/**'
      - '.github/workflows/arch-templates-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/architecture/**'
      - 'scripts/**'
      - '.github/workflows/arch-templates-check.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: arch-templates.generated.json is up to date
        run: npm run arch:templates:check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Python template-merge + pipeline tests
        run: python -m pytest scripts/tests -q
